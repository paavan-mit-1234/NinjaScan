version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://ninjascan:ninjascan_pass@db:5432/ninjascan_db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - MAX_CONTENT_LENGTH=52428800
      - UPLOAD_FOLDER=/app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ninjascan
      - POSTGRES_PASSWORD=ninjascan_pass
      - POSTGRES_DB=ninjascan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninjascan -d ninjascan_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
